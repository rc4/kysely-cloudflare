name: CI
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3 # immutable tag
        with:
          cache: true
          runtime: node@24
          require-lockfile: true
      - run: pnpm check
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.txt') != '' }}
        run: printf '```\n%s\n```\n' "$(cat coverage/summary.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
